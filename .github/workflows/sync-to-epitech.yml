name: Sync to Epitech

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Epitech
        run: |
          git remote add epitech https://x-access-token:${{ secrets.EPITECH_TOKEN }}@github.com/EpitechBachelorPromo2028/B-ING-300-PAR-3-1-codewash-21.git
          git push epitech --all --force
          git push epitech --tags --force
