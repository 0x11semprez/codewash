name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CodeWashGame/package-lock.json

      - name: Install dependencies
        working-directory: CodeWashGame
        run: npm ci

      - name: Lint
        working-directory: CodeWashGame
        run: npx eslint src/

      - name: Run tests
        working-directory: CodeWashGame
        run: npx vitest run --coverage

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: CodeWashGame
        run: docker build -t codewash-game:local .

      - name: Smoke test container
        run: |
          docker run -d --name codewash-test -p 8080:80 codewash-game:local
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker stop codewash-test
          docker rm codewash-test
