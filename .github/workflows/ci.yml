name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Static analysis
        run: npx eslint src/ --no-warn-ignored --max-warnings 0

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Test with coverage
        run: npm run test:coverage

      - name: Docker build
        run: docker build -t codewash:ci .

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
