name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint rules and complexity ceilings (eslint.config.js).
      # Security and quality analysis runs in codeql.yml.
      # Annotations appear inline on the PR diff thanks to the github-actions Vitest
      # reporter and the problem matcher that actions/setup-node installs for ESLint.
      - name: Lint and complexity ceilings (zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Test with coverage
        run: npx vitest run --coverage --reporter=default --reporter=github-actions

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:4173
          uploadArtifacts: true
          configPath: .github/lighthouserc.json
          temporaryPublicStorage: true

      - name: Docker build
        run: docker build -t codewash:ci .

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
